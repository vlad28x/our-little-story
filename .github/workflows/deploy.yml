name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Pages base path
        run: node -e "const b=process.env.VITE_BASE_PATH;if(!b || !b.startsWith('/') || !b.endsWith('/')){console.error('Set VITE_BASE_PATH repository variable to /repository-name/ or /');process.exit(1)}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run validate:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:offline
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish artifact
        id: deployment
        uses: actions/deploy-pages@v4
